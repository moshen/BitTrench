name: Release

# Releases are cut from CI runs, never from the push directly: workflow_run
# fires after CI finishes and every job below is gated on it having passed, so a
# red CI produces no release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  changes:
    name: Check for releasable changes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      releasable: ${{ steps.check.outputs.releasable }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history and tags: the comparison below needs the commit the
          # last release was cut from.
          fetch-depth: 0

      # Documentation on its own is not worth a version. The comparison is
      # against the last release rather than against this push, so a docs-only
      # push that ships nothing leaves the code it sat on still unreleased, and
      # the next push that does ship carries it along. Nothing releasable is
      # dropped by being pushed next to a README edit.
      #
      # A deny-list on purpose: anything not named here releases, so adding a
      # source directory cannot quietly stop releases. One release too many
      # spends a version number, one too few ships nothing.
      - name: Compare against the last release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          LAST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release; the first one always ships."
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! BASE=$(git rev-parse --verify --quiet "refs/tags/$LAST_TAG^{commit}"); then
            echo "::warning::tag $LAST_TAG has no commit here; releasing rather than guessing"
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing $LAST_TAG ($BASE) against $HEAD_SHA:"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD_SHA")
          echo "$CHANGED" | sed 's/^/  /'
          # Markdown and the git metadata files reach no binary and ship no
          # behaviour. config.sample.toml is deliberately absent: it is a file
          # operators copy and it travels inside the archive, so a change to it
          # is a change to the release.
          RELEASABLE=$(printf '%s\n' "$CHANGED" |
            grep -vE '(^|/)[^/]*\.md$|^\.git(ignore|attributes)$' || true)
          if [ -z "$RELEASABLE" ]; then
            echo "Only documentation changed since $LAST_TAG; no release."
            echo "releasable=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasable changes:"
            echo "$RELEASABLE" | sed 's/^/  /'
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          fi

  version:
    name: Compute version
    needs: changes
    if: needs.changes.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # YYYY.M.D-N, where N is the next build number for today.
      - name: Set version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DATE=$(date -u +%Y.%-m.%-d)
          MAX_BUILD=$(gh release list --limit 100 --json tagName | jq -r --arg date "$DATE" '
            [.[] | .tagName
             | select(test("^" + ($date | gsub("\\."; "\\.")) + "-[0-9]+$"))
             | capture("-(?<n>[0-9]+)$").n
             | tonumber] | max // 0
          ')
          BUILD=$((MAX_BUILD + 1))
          echo "version=${DATE}-${BUILD}" >> "$GITHUB_OUTPUT"

  build:
    name: Build release archives
    # needs: version inherits that job's CI gate - if it is skipped, so is this.
    needs: version
    # One runner builds every target. mise pins CGO_ENABLED=0, so the SQLite
    # driver is pure Go and no target needs a C toolchain - which is also why
    # this is a single job rather than a matrix: a matrix would pay four runner
    # setups, four toolchain installs and four cache restores to do the same
    # four cross-compiles, and would need its own copy of the target list.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-${{ hashFiles('go.sum') }}
          restore-keys: release-

      # mise run release owns the target list, the build flags and which
      # supporting files ship, so this workflow and a local release build cannot
      # drift apart. It lays out dist/<goos>-<goarch>/.
      - name: Cross-compile every target
        run: mise run release

      - name: Archive each target
        run: |
          mkdir -p artifacts
          for dir in dist/*/; do
            target=$(basename "$dir")
            # -C so the archive holds the directory's *contents*: an operator
            # unpacks bittrench and its files, not a wrapper directory.
            case "$target" in
              windows-*)
                (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/artifacts/bittrench-$target.zip" .)
                ;;
              *)
                tar czf "artifacts/bittrench-$target.tar.gz" -C "$dir" .
                ;;
            esac
          done
          ls -l artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: artifacts/

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.version }}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "${{ needs.version.outputs.version }}" \
            --generate-notes \
            artifacts/*

  # One image per linux architecture, plus a multi-arch tag over the two, on
  # GHCR. The images package the binaries the release already published rather
  # than compiling again: the archive is downloaded and unpacked back into
  # dist/<goos>-<goarch>/, which is the layout mise run docker and the Dockerfile
  # expect, so the bytes an operator pulls are the bytes an operator downloads.
  # Nothing here runs a foreign binary, so both architectures build on this
  # amd64 runner with no emulation.
  docker:
    name: Push the container images
    needs: [version, release]
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow's, so contents has to be restated
    # for the checkout; packages:write is what pushes to GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: artifacts

      # The archive holds the release directory's *contents*, so unpacking it
      # into dist/linux-<arch>/ rebuilds exactly the tree mise run release lays
      # out - binary, sample config and README together.
      - name: Restage the published linux builds
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "dist/linux-$arch"
            tar xzf "artifacts/bittrench-linux-$arch.tar.gz" -C "dist/linux-$arch"
          done
          find dist -type f

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: jdx/mise-action@v4

      # mise run docker owns the tags and the architecture list for the same
      # reason mise run release owns the target list.
      - name: Build and push both architectures
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PUSH: "1"
        run: |
          # GHCR rejects an upper-case path, and this repository has one.
          IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "pushing $IMAGE:$VERSION"
          IMAGE="$IMAGE" mise run docker

  # The bucket lives in its own repo so scoop users can add it without cloning
  # BitTrench, which means pushing across a repository boundary: GITHUB_TOKEN is
  # scoped to this repo only, hence a deploy key held as a secret here whose
  # public half has write access there.
  scoop:
    name: Update the scoop bucket
    needs: [version, release]
    runs-on: ubuntu-latest
    # SCOOP_DEPLOY_KEY is an environment secret, so without this the job sees
    # an empty string and skips. The environment's branch policy allows main,
    # which is the only branch this workflow runs for.
    environment: Release
    steps:
      # A missing key is not a reason to fail a release that already published.
      # The warning is so a key that gets revoked later is still noticed.
      - name: Look for the deploy key
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.SCOOP_DEPLOY_KEY }}
        run: |
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::warning::SCOOP_DEPLOY_KEY is unset; leaving the scoop bucket alone"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Point the manifest at this release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          DEPLOY_KEY: ${{ secrets.SCOOP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          ASSET=bittrench-windows-amd64.zip

          # Hash the asset as published rather than rebuilding it here, so the
          # manifest describes the exact bytes scoop will download.
          gh release download "$VERSION" --pattern "$ASSET" --dir "$RUNNER_TEMP"
          HASH=$(sha256sum "$RUNNER_TEMP/$ASSET" | cut -d' ' -f1)
          echo "$ASSET sha256 $HASH"

          KEY="$RUNNER_TEMP/scoop_deploy_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$DEPLOY_KEY" > "$KEY"
          # IdentitiesOnly so a runner's own agent keys are never tried, and the
          # clone below is the only thing this key is ever used for.
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:moshen/BitTrench-scoop.git "$RUNNER_TEMP/bucket"
          cd "$RUNNER_TEMP/bucket"
          # --indent 4 matches how scoop buckets are written, so a release
          # rewrites three values instead of reformatting the whole manifest.
          jq --indent 4 --arg v "$VERSION" --arg h "$HASH" '
            .version = $v
            | .architecture["64bit"].url =
                "https://github.com/moshen/BitTrench/releases/download/\($v)/bittrench-windows-amd64.zip"
            | .architecture["64bit"].hash = $h
          ' bucket/bittrench.json > bucket/bittrench.json.new
          mv bucket/bittrench.json.new bucket/bittrench.json
          git --no-pager diff

          # A re-run of a release that already updated the bucket should be a
          # no-op rather than an empty commit.
          if git diff --quiet; then
            echo "The manifest already describes $VERSION."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qam "bittrench: $VERSION"
          git push
