[tools]
go = "latest"
# biome lints and formats the embedded web UI under internal/webui/assets/.
biome = "latest"

[env]
# `noboltdb` keeps go.etcd.io/bbolt out of the binary. anacrolix/torrent's
# storage package selects a piece-completion backend by build tag: the SQLite
# one is cgo-only, so a CGO_ENABLED=0 build would otherwise link the bbolt
# fallback. We supply our own SQLite-backed storage.PieceCompletion and never
# call NewDefaultPieceCompletionForDir, so the fallback is dead weight - and
# one persistence backend, not two, is the point.
#
# `http2legacy` keeps golang.org/x/net/http2 compiling its own HTTP/2 code
# rather than wrapping net/http's. Under Go 1.27 the wrapper is the default and
# it drops http2.GoAwayError, which anacrolix/torrent references to pick a log
# level for webseed GOAWAYs - so without the tag the dependency stops building.
# Drop this once anacrolix/torrent no longer needs GoAwayError.
GOFLAGS = "-tags=noboltdb,http2legacy"
CGO_ENABLED = "0"

# Tasks. Everything here runs through mise, so the pinned toolchain and the two
# env settings above apply - which is the whole reason the tasks exist rather
# than a README section listing `mise exec -- go ...` lines.

[tasks.build]
description = "Build every package for this host"
run = "go build ./..."

[tasks.test]
description = "Run the full test suite (~10s; no network, VPN or privileges needed)"
run = "go test ./..."

[tasks.fmt]
description = "Format the Go sources and the embedded web UI"
run = ["gofmt -w cmd internal", "biome check --write internal/webui/assets/"]

[tasks.check]
description = "Everything CI checks: formatting, vet for both GOOSes, biome, deps, tests"
run = [
  # gofmt exits 0 whether or not it names a file, so the naming is the failure.
  """
  unformatted=$(gofmt -l cmd internal)
  if [ -n "$unformatted" ]; then echo "gofmt needs to run on:"; echo "$unformatted"; exit 1; fi
  """,
  "go vet ./...",
  # The Windows service code is build-tagged, so the host vet never compiles it.
  "env GOOS=windows go vet ./...",
  "biome check internal/webui/assets/",
  # bbolt, go-llsqlite and zombiezen must stay out of the build.
  """
  found=$(go list -deps ./... | grep -Ei "bbolt|llsqlite|zombiezen" || true)
  if [ -n "$found" ]; then echo "unwanted dependencies in the build:"; echo "$found"; exit 1; fi
  """,
  "go test ./...",
]

# The release build: every target cross-compiles from one host because
# CGO_ENABLED=0 keeps the SQLite driver pure Go. -trimpath strips the build
# directory out of the binary, which is also one less thing leaking a local path.
[tasks.release]
description = "Cross-compile stripped release trees for every target into dist/<goos>-<goarch>/"
run = """
set -e
# A stale binary from a target that has since been dropped would otherwise
# survive here and ship inside an archive.
rm -rf dist
for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
  goos=${target%/*}
  goarch=${target#*/}
  ext=""
  [ "$goos" = "windows" ] && ext=".exe"
  out="dist/$goos-$goarch"
  echo "building $goos/$goarch"
  mkdir -p "$out"
  env GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" \
    -o "$out/bittrench$ext" ./cmd/bittrench
  # One directory per target, holding exactly what ships: the release archive is
  # this directory's contents, so anything an operator needs beside the binary
  # has to be staged here rather than added on by the workflow.
  cp README.md config.sample.toml "$out/"
done
find dist -type f
"""

# The container image. It packages what `mise run release` built rather than
# compiling anything itself, so the binary in the image is the binary in the
# archive - see the Dockerfile. Owning the tags and the architecture list here
# is what keeps the release workflow and a local image build from drifting.
[tasks.docker]
description = "Build the amd64 and arm64 container images from dist/linux-* (IMAGE, VERSION, PUSH=1)"
run = """
set -e
image=${IMAGE:-ghcr.io/moshen/bittrench}
version=${VERSION:-dev}
push=${PUSH:-0}

# One image per released linux architecture, each tagged on its own so a
# deployment can pin an arch, and joined below into a multi-arch tag so a plain
# pull still resolves to the right one.
if [ "$push" = "1" ]; then
  output=--push
  archs=${ARCHS:-amd64 arm64}
else
  # A local build loads into the host's docker, which holds one architecture per
  # tag and no manifest list at all - so it builds this host's architecture only.
  output=--load
  case "$(uname -m)" in
    aarch64|arm64) archs=${ARCHS:-arm64} ;;
    *) archs=${ARCHS:-amd64} ;;
  esac
fi

for arch in $archs; do
  if [ ! -x "dist/linux-$arch/bittrench" ]; then
    echo "dist/linux-$arch/bittrench is missing; run 'mise run release' first" >&2
    exit 1
  fi
done

tags=""
for arch in $archs; do
  echo "building $image:$version-$arch"
  docker buildx build "$output" \
    --platform "linux/$arch" \
    --build-arg "VERSION=$version" \
    -t "$image:$version-$arch" \
    .
  tags="$tags $image:$version-$arch"
done

if [ "$push" != "1" ]; then
  echo "built$tags - set PUSH=1 to publish both architectures and the manifest"
  exit 0
fi

# imagetools rather than a third build: it assembles the manifest list from the
# two images just pushed, so :version resolves to exactly those digests and
# nothing is built twice. :latest moves only for a real version.
if [ "$version" = "dev" ]; then
  docker buildx imagetools create -t "$image:$version" $tags
else
  docker buildx imagetools create -t "$image:$version" -t "$image:latest" $tags
fi
docker buildx imagetools inspect "$image:$version"
"""
